# Root gradle.properties.
#
# Added alongside :detector-app (com.android.application). AndroidX is required
# by AGP 8.x; Jetifier is off (no legacy support-lib deps). The JVM-only
# modules (:detection, :detection-cli) are unaffected by these flags.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Larger heap for AGP resource processing + dexing.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
