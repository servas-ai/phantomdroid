# =============================================================================
# L0b.compose.yml — Magisk + ReZygisk root-of-trust baseline (layer L0b)
# =============================================================================
# Owner:        Stability Agent (id=174f9181-63c9-40b5-8041-46beef440e56)
# Filed under:  GOAL-Power-1 acceptance #3 (SpoofStack layer scaffolding)
# Layer set:    L0a + L0b (root + Zygisk reimplementation)
# Reference:    agents/stability/stack/layers.md §L0 — Container Baseline
#
# Safety boundary
# ---------------
# This compose file describes a lab cell for measuring detection signals in
# owned test environments. It MUST NOT be used as an operational tool for
# bypassing third-party anti-abuse, anti-bot, attestation, account-integrity,
# or fraud controls. See agents/stability/stack/layers.md §"Safety boundary".
#
# Purpose
# -------
# L0b layers Magisk v27.2 + ReZygisk v1.3.4 + LSPosed (JingMatrix fork)
# v1.10.1 on top of the L0a ReDroid baseline. The compose binds the Magisk
# data directories so the orchestrator can pre-stage Magisk module artefacts
# before first boot; the Magisk APK install proper is performed via
# `docker exec ... pm install` as described in the L0b RUNBOOK §3.
#
# Refuse-privileged-compose preflight (6 checks — all MUST PASS):
#   1. No privileged: true, no cap_add: SYS_ADMIN / ALL, no pid:host,
#      no network:host, no ipc:host, no userns_mode:host, no docker.sock.
#   2. cap_drop: [ALL] on every service.
#   3. security_opt seccomp profile referenced.
#   4. security_opt no-new-privileges:true present.
#   5. Image pinned by @sha256 digest from ../image-pins.yml.
#   6. ADB exposure bound to 127.0.0.1 only.
#
# Bring-up:
#   docker compose \
#     -f agents/stability/stack/compose/L0a.yml \
#     -f agents/stability/stack/compose/L0b.compose.yml \
#     up -d
#
# Sequel: see agents/stability/stack/L0b-RUNBOOK.md for the bring-up runbook.
# =============================================================================

name: stability-l0b

x-l0b-base: &l0b-base
  # Pin by digest from ../image-pins.yml::redroid_12_64only.digest_amd64.
  # Stability's container_lifecycle.py rewrites this to digest_arm64 when
  # the host architecture is aarch64 (single source of truth: image-pins.yml).
  image: "redroid/redroid@sha256:e6f799d56b9a9a2bbc6224b5b7a6dc744c9b4d878ac856f27f0c4ec793ef55d3"
  platform: "linux/amd64"
  restart: "no"
  init: true

  cap_drop:
    - ALL
  cap_add:
    - SYS_NICE
    - SYS_RESOURCE
    - SYS_PTRACE
    - MKNOD
    - SETUID
    - SETGID
    - SETPCAP
    - NET_BIND_SERVICE
    - DAC_OVERRIDE
    - DAC_READ_SEARCH
    - FOWNER
    - FSETID
    - KILL
    - AUDIT_WRITE

  security_opt:
    - "no-new-privileges:true"
    - "seccomp=./agents/stability/stack/seccomp/redroid-seccomp.json"
    - "apparmor=unconfined"

  devices:
    - /dev/binder:/dev/binder
    - /dev/hwbinder:/dev/hwbinder
    - /dev/vndbinder:/dev/vndbinder
    - /dev/ashmem:/dev/ashmem

  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: "4g"
      reservations:
        cpus: "0.5"
        memory: "2g"

  healthcheck:
    test:
      - CMD
      - sh
      - -c
      - "getprop sys.boot_completed | grep -q 1"
    interval: 10s
    timeout: 5s
    retries: 36           # 36 * 10s = 6 min boot budget for L0a+L0b
    start_period: 60s

  environment: &l0b-env
    ANDROID_DATA: "/data"
    androidboot.hardware: "redroid"
    androidboot.redroid_google_play_store: "0"
    redroid.gpu.mode: "guest"
    RESEARCH_LAYER_SET: "L0a+L0b"

  labels: &l0b-labels
    research.phase: "L0b-magisk-baseline"
    research.layer_set: "L0a+L0b"
    research.compose_file: "agents/stability/stack/compose/L0b.compose.yml"
    research.runbook: "agents/stability/stack/L0b-RUNBOOK.md"
    research.owner: "stability"

services:

  redroid-l0b:
    <<: *l0b-base
    container_name: "stability-l0b-redroid"
    hostname: "l0b"
    ports:
      - "127.0.0.1:15556:5555"   # ADB on loopback only
    volumes:
      # Magisk data dirs — Magisk-managed persistence for the v27.2 app
      # install + ReZygisk + LSPosed module trees. Pre-stage by the
      # orchestrator before first boot; see L0b-RUNBOOK §3.
      - "./results/l0b/data-adb-magisk:/data/adb/magisk:rw"
      - "./results/l0b/data-adb-modules:/data/adb/modules:rw"
      # Per-cell results dir (writable, isolated)
      - "./results/l0b/out:/opt/research/results:rw"
    environment:
      <<: *l0b-env
      RESEARCH_TARGET_PROBES: "rank-1..3 root.* signals"
    labels:
      <<: *l0b-labels

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.60.0/29

volumes: {}
