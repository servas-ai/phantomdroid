name: "Python tools :: full pytest suite"

on:
  pull_request:
    paths:
      - 'tests/**'
      - 'agents/orchestrator/**'
      - 'scripts/**'
      - 'apps/detector-lab/scripts/**'
      - 'shared/probe-schema.v2.json'
      - '.github/workflows/python-tools-test.yml'
  push:
    branches:
      - main
    paths:
      - 'tests/**'
      - 'agents/orchestrator/**'
      - 'scripts/**'
      - 'apps/detector-lab/scripts/**'
      - '.github/workflows/python-tools-test.yml'

permissions:
  contents: read

jobs:
  pytest-full:
    name: Run full tests/ suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install test deps
        run: python -m pip install --upgrade pip pytest pyyaml jsonschema

      - name: Run full pytest suite
        run: |
          set -euo pipefail
          export PYTHONPATH="${GITHUB_WORKSPACE}"
          python -m pytest tests/ -v --junitxml=pytest-tools.xml

      - name: Assert a healthy test count (regression guard, >= 90)
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          t = f = e = 0
          for x in glob.glob("pytest-tools.xml"):
              r = ET.parse(x).getroot()
              for ts in r.iter("testsuite"):
                  t += int(ts.get("tests", 0)); f += int(ts.get("failures", 0)); e += int(ts.get("errors", 0))
          print(f"pytest tools: total={t} failures={f} errors={e}")
          sys.exit(1 if (f or e or t < 90) else 0)
          PY

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pytest-tools-results
          path: pytest-tools.xml
          retention-days: 14
          if-no-files-found: warn
