name: "Orchestrator :: pytest (PR gate)"

on:
  pull_request:
    paths:
      - 'agents/orchestrator/**'
      - 'tests/test_orchestrator_*.py'
      - '.github/workflows/orchestrator-test.yml'
  push:
    branches:
      - main
    paths:
      - 'agents/orchestrator/**'
      - 'tests/test_orchestrator_*.py'
      - '.github/workflows/orchestrator-test.yml'

permissions:
  contents: read

jobs:
  pytest:
    name: Run orchestrator pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.10'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run orchestrator pytest suite
        run: |
          set -euo pipefail
          export PYTHONPATH="${GITHUB_WORKSPACE}"
          python -m pytest tests/test_orchestrator_*.py -v --junitxml=pytest-orchestrator.xml

      - name: Upload pytest JUnit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: orchestrator-pytest-results
          path: pytest-orchestrator.xml
          retention-days: 14
          if-no-files-found: warn
