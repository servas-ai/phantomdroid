// Top-level build configuration for the SpoofStack LSPosed module.
// Deployer must have Android Gradle Plugin 8.x and JDK 17.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // LSPosed-api is published to JitPack
        maven { url 'https://api.xposed.info/' }
        maven { url 'https://jitpack.io' }
    }
}
