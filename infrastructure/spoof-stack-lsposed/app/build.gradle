// SpoofStack LSPosed module — app/build.gradle
//
// Applies com.android.application (LSPosed modules are installed as
// regular APKs that LSPosed loads at runtime; library projects do not
// produce installable APKs).

apply plugin: 'com.android.application'

android {
    namespace 'io.spoofstack.redroid'
    compileSdk 33

    defaultConfig {
        applicationId 'io.spoofstack.redroid'
        minSdk 27          // LSPosed minimum (Android 8.1)
        targetSdk 33
        versionCode 100
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    // LSPosed API — provided by the LSPosed framework at runtime; must NOT
    // be packaged into the APK. Use compileOnly.
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
}
